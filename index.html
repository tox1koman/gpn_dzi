<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Valhalla Isochrone</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    html, body {
      margin: 0;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map").setView([50.1109, 8.6821], 11);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }
).addTo(map);


// Загружаем GeoJSON, который создал Valhalla
fetch("/isochrone.json")
  .then(response => {
    if (!response.ok) {
      throw new Error("Не удалось загрузить isochrone.json");
    }

    return response.json();
  })
  .then(data => {

    const layer = L.geoJSON(data, {
      style: function(feature) {
        const minutes =
          feature.properties &&
          (feature.properties.contour ||
           feature.properties.time);

        return {
          weight: 2,
          fillOpacity: 0.25
        };
      }
    }).addTo(map);

    // Автоматически приблизить карту к изохроне
    if (layer.getBounds().isValid()) {
      map.fitBounds(layer.getBounds());
    }
  })
  .catch(error => {
    console.error(error);
  });
</script>

</body>
</html>
